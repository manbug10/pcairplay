name: Release

# Tag vX.Y.Z -> build the net-installer and the plain-scripts zip, hash both,
# publish a GitHub release with all three files attached.
on:
  push:
    tags: ['v*']
  # Tag pushes occasionally fail to register the trigger; workflow_dispatch
  # against the tag ref reproduces the exact same build on demand.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: ver
        shell: powershell
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build installer
        shell: powershell
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe"
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe not found after install attempt.' }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\pcairplay.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Zip the scripts (no-installer option)
        shell: powershell
        run: |
          $files = 'uxplay-common.ps1', 'setup.ps1', 'start-airplay.ps1',
                   'airplay-ui.ps1', 'frame-mirror.ps1', 'doctor.ps1',
                   'AirPlayPC.vbs', 'AirPlayPC.cmd', 'Diagnostics.cmd',
                   'Framed Mirror.cmd', 'README.md', 'LICENSE', 'pcairplay.ico'
          Compress-Archive -Path $files -DestinationPath "AirPlayPC-${{ steps.ver.outputs.version }}.zip"

      - name: Archive the Arch Linux port
        shell: bash
        run: |
          tar -czf "AirPlayPC-${{ steps.ver.outputs.version }}-arch.tar.gz" \
            arch setup.sh start-airplay.sh doctor.sh AirPlayPC.sh AirPlayPC-Control.sh README.md LICENSE

      - name: SHA256SUMS
        shell: powershell
        run: |
          $items = @(Get-Item installer\Output\*.exe) + @(Get-Item AirPlayPC-*.zip) + @(Get-Item AirPlayPC-*-arch.tar.gz)
          $lines = foreach ($f in $items) {
            '{0}  {1}' -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $f.Name
          }
          $lines | Out-File SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Create GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = (Get-Item installer\Output\*.exe).FullName
          $zip = (Get-Item AirPlayPC-*.zip).FullName
          $arch = (Get-Item AirPlayPC-*-arch.tar.gz).FullName
          gh release create "${{ github.ref_name }}" $exe $zip $arch SHA256SUMS.txt --title "AirPlayPC ${{ steps.ver.outputs.version }}" --generate-notes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
