name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  arch-port:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # These tests intentionally need neither a display nor UxPlay. They pin
      # the cross-entry-point argv contract and catch Python/shell regressions.
      - name: Python syntax and shared argv self-test
        run: |
          python3 -m py_compile arch/*.py
          python3 arch/pcairplay.py self-test
          python3 arch/airplay-ui.py --self-test
          python3 arch/frame-mirror.py --self-test
          python3 arch/assistive-control.py --self-test

      - name: Shell syntax and setup preview
        run: |
          for file in arch/setup.sh arch/PKGBUILD setup.sh start-airplay.sh doctor.sh AirPlayPC.sh AirPlayPC-Control.sh; do
            bash -n "$file"
          done
          # setup correctly refuses non-Arch hosts; exercise its help parser here.
          ./arch/setup.sh --help

  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The exact flow a new user runs, minus the engine binary: the vendor's
      # 1.72.1-3 Inno installer stalls forever with /VERYSILENT on session-0
      # runners (verified in run 41249461119 - download and SHA-256 verified in
      # seconds, then the silent install never finished), so CI installs the
      # firewall rules and repair logic against an absent engine via
      # -SkipInstall. The self-tests below explicitly support "no usable
      # engine". Bonjour is absent on runners and cannot be redistributed, so
      # its check is downgraded to a warning here.
      - name: Real setup (firewall rules, engine absent)
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\setup.ps1 -SkipInstall -SkipBonjourCheck

      - name: UI self-test
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\airplay-ui.ps1 -SelfTest

      - name: Framed-mirror self-test
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\frame-mirror.ps1 -SelfTest

      - name: CLI dry-run (argv construction)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\start-airplay.ps1 -DryRun

      - name: Setup preview (-WhatIf)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\setup.ps1 -WhatIf

      # Informational: doctor exits 1 on runners (no Bonjour, no display of
      # problems is expected to stay green here) but its output catching a
      # regression in the checks themselves is still worth a look.
      - name: Doctor (informational)
        shell: powershell
        continue-on-error: true
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\doctor.ps1

      # Exercises the teardown against the rules the real setup above created.
      - name: Uninstall (removes the firewall rules)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\setup.ps1 -Uninstall

  installer:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compile installer (smoke build)
        shell: powershell
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe"
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe not found after install attempt.' }
          & $iscc /DMyAppVersion=0.0.0-ci installer\pcairplay.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: installer-ci
          path: installer/Output/*.exe
